name: SDK validation

on:
  push:
    paths:
      - "SDKs/**"
      - "SDK Sample Applications/**"
      - "docs/sdk-versioning-support.md"
      - ".github/workflows/sdk-validation.yml"
  pull_request:
    paths:
      - "SDKs/**"
      - "SDK Sample Applications/**"
      - "docs/sdk-versioning-support.md"
      - ".github/workflows/sdk-validation.yml"

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: dotnet build SDKs/SDK-.NET/Amrod.SDK/Amrod.SDK.csproj --configuration Release
      - run: dotnet pack SDKs/SDK-.NET/Amrod.SDK/Amrod.SDK.csproj --configuration Release --no-build --output artifacts

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SDKs/SDK-TS/package-lock.json
      - run: npm ci
        working-directory: SDKs/SDK-TS
      - run: npm run generate
        working-directory: SDKs/SDK-TS
      - run: npm run validate-schema
        working-directory: SDKs/SDK-TS
      - run: npm run typecheck
        working-directory: SDKs/SDK-TS
      - run: npm run build
        working-directory: SDKs/SDK-TS

  consumers:
    runs-on: ubuntu-latest
    needs: [dotnet, typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: dotnet build "SDK Sample Applications/SDK-.NET-CONSUMER/Amrod.SDK.Consumer/Amrod.SDK.Consumer.csproj"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: SDK Sample Applications/SDK-TS-CONSUMER
      - run: npm run build
        working-directory: SDK Sample Applications/SDK-TS-CONSUMER
